# Közzététel a cPanel Git Version Control-jával: Manage → Pull or Deploy → "Update from Remote", majd "Deploy HEAD
# Commit". Csak a weboldal fájljai kerülnek fel (az android/, a docs/ és a többi fejlesztői fájl nem):
#   <aldomain gyökere>/            a kezdőoldal (landing/index.html)
#   <aldomain gyökere>/webkantor/  a program és az API (webkantor/api/)
# A repó klónja ne az aldomain mappájában legyen (pl. ~/repositories/orgonatar), különben a .git is elérhető lenne.
# DEPLOYROOT: az orgonatar.martone.hu aldomain gyökérmappája (cPanel → Domains → Document Root); ha más, itt kell átírni.
---
deployment:
  tasks:
    - export DEPLOYROOT=$HOME/orgonatar.martone.hu
    - export APPDIR=$DEPLOYROOT/webkantor
    - /bin/mkdir -p $APPDIR
    - /bin/cp landing/index.html $DEPLOYROOT/
    - /bin/cp index.html app.min.js style.css sw.js orgonatar-logo.svg $APPDIR/
    - /bin/cp -R libs fonts icons data api $APPDIR/
